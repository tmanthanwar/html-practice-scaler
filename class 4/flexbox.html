<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
            text-decoration: underline;
        }
        
        .container {
            width: 95%;
            margin: 5px;
            padding: 10px;
            background: lightblue;
            border: 2px solid black;
            border-radius: 4px;
            height: 300px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 50px;
            /* flex-wrap: wrap; */
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            /* margin: 10px; */
            /* flex-grow: 1; */
        }
    </style>
</head>
<body>
    <h1>CSS Flexbox</h1>
    <div class="container">
      <div class="box" id="box-a">1</div>
      <div class="box" id="box-b">2</div>
      <div class="box" id="box-c">3</div>
      <div class="box" id="box-d">4</div>
      <div class="box" id="box-b">5</div>
      <div class="box" id="box-c">6</div>
      <div class="box" id="box-d">7</div>
      <div class="box" id="box-b">8</div>
      <div class="box" id="box-c">9</div>
      <div class="box" id="box-d">10</div>
    </div>
</body>
</html>
