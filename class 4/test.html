<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile-section {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background-color: #4CAF50;
            border-radius: 50%;
        }

        .profile-info h2 {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .profile-info p {
            margin: 5px 0 0 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="profile-section">
    <div class="profile-avatar"></div>
    
    <div class="profile-info">
      <h2>Jane Doe</h2>
      <p>Full stack developer in training. Building projects with HTML, CSS, and JavaScript.</p>
    </div>
</body>
</html>
